[package]
name = "monfluo-cli"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive", "error-context"] }
directories = "6.0.0"
monfluo-oxide = { git = "https://codeberg.org/Monfluo/monfluo-oxide" }
ratatui = "0.30.0"
strum = "0.27.2"
tokio = { version = "1.49.0", features = ["io-std", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.8.2"

[[bin]]
name = "monfluo"
path = "src/main.rs"
