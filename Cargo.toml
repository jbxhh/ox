[package]
name = "monfluo-cli"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
clap = { version = "4.5.60", features = ["derive", "error-context"] }
directories = "6.0.0"
monfluo-oxide = { git = "https://codeberg.org/Monfluo/monfluo-oxide" }
ratatui = "0.30.0"
strum = "0.27.2"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread"] }
zeroize = "1.8.2"

[[bin]]
name = "monfluo"
path = "src/main.rs"

