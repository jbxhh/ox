[package]
name = "monfluo-oxide"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"

[workspace.dependencies]
tokio = "1.49.0"

[dependencies]
monero-wallet-util = { git = "https://codeberg.org/Monfluo/monero-wallet-util.git", branch = "monfluo", features = ["strum"] }
monero-wallet = { git = "https://codeberg.org/Monfluo/monero-oxide.git", branch = "monfluo" }
monero-simple-request-rpc = { git = "https://codeberg.org/Monfluo/monero-oxide.git", branch = "monfluo" }
tokio = { workspace = true, features = ["fs", "io-util"] }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
zeroize = "1.8.2"
curve25519-dalek = "4.1.3"
url = "2.5.8"
subtle = "2.6.1"
strum = { version = "0.27.2", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros"] }
tempfile = "3.27.0"
