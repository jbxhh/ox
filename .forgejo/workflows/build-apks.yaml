on:
  push:
    branches:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-legacy-native-libraries:
    runs-on: docker
    container:
      image: debian:bookworm
    steps:
      - name: Update Debian repository, upgrade existing packages and install new required packages
        run: |
            apt update && apt upgrade -y
            apt install -y unzip automake build-essential curl file pkg-config git python3 python-is-python3 libtool libtinfo5 yacc nodejs wget
      - name: Checkout Monfluo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Checkout Monero submodules
        run: |
          cd external-libs/monero
          git submodule update --init --force
      - name: Download dependencies for native libraries
        run: |
          export MONFLUO_DEPENDENCIES_DIRECTORY=/opt/android/dependencies
          . ./external-libs/bin/envs.sh
          ./external-libs/bin/download-native-libs-dependencies.sh
# <ARM32>
      - name: Build legacy native libraries (ARM32)
        run: |
          export MONFLUO_DEPENDENCIES_DIRECTORY=/opt/android/dependencies
          export MONFLUO_BUILD_DIRECTORY=/opt/android/monfluo-build-arm32
          export MONFLUO_OUTPUT_DIRECTORY=/opt/android/monfluo-output-arm32
          export NPROC=$(nproc)
          . ./external-libs/bin/envs.sh
          ./external-libs/bin/build-native-libs-arm32.sh
      - name: Upload built legacy native libraries (ARM32)
        uses: actions/upload-artifact@v3
        with:
          name: legacy-native-libs-armeabi-v7a
          path: /opt/android/monfluo-output-arm32
# </ARM32>
# <ARM64>
      - name: Build legacy native libraries (ARM64)
        run: |
          export MONFLUO_DEPENDENCIES_DIRECTORY=/opt/android/dependencies
          export MONFLUO_BUILD_DIRECTORY=/opt/android/monfluo-build-arm64
          export MONFLUO_OUTPUT_DIRECTORY=/opt/android/monfluo-output-arm64
          export NPROC=$(nproc)
          . ./external-libs/bin/envs.sh
          ./external-libs/bin/build-native-libs-arm64.sh
      - name: Upload built legacy native libraries (ARM64)
        uses: actions/upload-artifact@v3
        with:
          name: legacy-native-libs-arm64-v8a
          path: /opt/android/monfluo-output-arm64
# </ARM64>
# <X86_64>
      - name: Build legacy native libraries (X86_64)
        run: |
          export MONFLUO_DEPENDENCIES_DIRECTORY=/opt/android/dependencies
          export MONFLUO_BUILD_DIRECTORY=/opt/android/monfluo-build-x86_64
          export MONFLUO_OUTPUT_DIRECTORY=/opt/android/monfluo-output-x86_64
          export NPROC=$(nproc)
          . ./external-libs/bin/envs.sh
          ./external-libs/bin/build-native-libs-x86_64.sh
      - name: Upload built legacy native libraries (X86_64)
        uses: actions/upload-artifact@v3
        with:
          name: legacy-native-libs-x86_64
          path: /opt/android/monfluo-output-x86_64
# </X86_64>
  build-apks:
    needs:
      - build-legacy-native-libraries
    runs-on: docker
    container:
      image: docker.io/cimg/android:2026.03.1-ndk
    steps:
      - name: Update Debian repository and upgrade existing packages
        run: |
            # nushell is not available in ubuntu / debian repos
            wget -qO- https://apt.fury.io/nushell/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg
            echo "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /" | sudo tee /etc/apt/sources.list.d/fury-nushell.list
            sudo apt update
            sudo apt upgrade -y
            sudo apt install -y nushell just ripgrep rustup
      # Needed for download action, can be removed after we get rid of monero legacy native libraries
      - name: Install node
        run: |
            curl -sL https://deb.nodesource.com/setup_18.x -o nodesource_setup.sh
            sudo bash nodesource_setup.sh
            sudo apt install -y nodejs
      - name: Checkout Monfluo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build, test and lint native libraries
        run: |
            rustup default stable
            (
              cd monfluo-oxide-jni
              cargo test
              cargo fmt --check
            ) || exit $?
            rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
            # Does not work because Ubuntu 24 has old `just` package :/
            # just app-copy-native-libs-all
            export ANDROID_NDK_HOST=linux-x86_64
            ./bin/build-oxide-native-lib.nu native
            ./bin/build-oxide-native-lib.nu arm32
            ./bin/build-oxide-native-lib.nu arm64
            ./bin/build-oxide-native-lib.nu x86_64
            mkdir -p app/src/main/jniLibs/armeabi-v7a
            mkdir -p app/src/main/jniLibs/arm64-v8a
            mkdir -p app/src/main/jniLibs/x86_64
            cp monfluo-oxide-jni/target/armv7-linux-androideabi/debug/libmonfluo_oxide.so app/src/main/jniLibs/armeabi-v7a
            cp monfluo-oxide-jni/target/aarch64-linux-android/debug/libmonfluo_oxide.so app/src/main/jniLibs/arm64-v8a
            cp monfluo-oxide-jni/target/x86_64-linux-android/debug/libmonfluo_oxide.so app/src/main/jniLibs/x86_64
      - name: Run tests and lints
        run: |
          export LD_LIBRARY_PATH=$(realpath monfluo-oxide-jni/target/debug) && ./gradlew :monfluo-oxide-kotlin:test
          ./gradlew :app:test
          ./gradlew ktlintCheck
      - name: Copy legacy native headers
        run: |
          mkdir -p external-libs/build/include
          cp external-libs/monero/src/wallet/api/wallet2_api.h external-libs/build/include/wallet2_api.h
# <ARM32>
      - name: Download built legacy native libs (ARM32)
        uses: actions/download-artifact@v3
        with:
          name: legacy-native-libs-armeabi-v7a
          path: external-libs/build/armeabi-v7a
# </ARM32>
# <ARM64>
      - name: Download built legacy native libs (ARM64)
        uses: actions/download-artifact@v3
        with:
          name: legacy-native-libs-arm64-v8a
          path: external-libs/build/arm64-v8a
# </ARM64>
# <X86_64>
      - name: Download built legacy native libs (X86_64)
        uses: actions/download-artifact@v3
        with:
          name: legacy-native-libs-x86_64
          path: external-libs/build/x86_64
# </X86_64>
      - name: Make sure release build succeeds
        run: |
          ./gradlew -P monfluo-all -P monfluo-universal assembleRelease
      - name: Save debug keystore
        run: |
            if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
              mkdir -p "$HOME/.android"
              echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
              echo "Saved debug keystore"
            else
              echo "Debug keystore could not be saved because Forgejo secrets are not available"
            fi
      - name: Build debug APKs
        run: ./gradlew -P monfluo-all -P monfluo-universal assembleDebug
      - name: Upload built debug APKs
        uses: actions/upload-artifact@v3
        with:
          name: apks
          path: app/build/outputs/apk/debug/*.apk
