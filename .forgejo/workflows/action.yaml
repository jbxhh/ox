on:
  push:
    branches:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-apks:
    runs-on: codeberg-medium-lazy
    container:
      image: ubuntu:26.04
    steps:
      - name: Update, upgrade and install packages
        run: |
            apt update
            apt upgrade -y
            apt install -y build-essential musl-tools nodejs rustup
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build, test and lint
        run: |
            rustup default stable
            cargo test
            cargo fmt --check
            rustup target add x86_64-unknown-linux-musl
            cargo build --target=x86_64-unknown-linux-musl
            cargo build --target=x86_64-unknown-linux-musl --release
      - name: Upload built debug binary
        uses: actions/upload-artifact@v3
        with:
          name: monfluo-debug
          path: target/x86_64-unknown-linux-musl/debug/monfluo
      - name: Upload built release binary
        uses: actions/upload-artifact@v3
        with:
          name: monfluo-release
          path: target/x86_64-unknown-linux-musl/release/monfluo
