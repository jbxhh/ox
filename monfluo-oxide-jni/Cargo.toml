[package]
name = "monfluo-oxide-jni"
version = "0.1.0"
edition = "2024"

[dependencies]
monfluo-oxide = { git = "https://codeberg.org/Monfluo/monfluo-oxide" }
jni = "0.22.4"
const_format = "0.2.35"
jni-macros = "0.22.4"

[lib]
name = "monfluo_oxide"
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
