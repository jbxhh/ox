[package]
name = "monfluo-oxide-jni"
version = "0.1.0"
edition = "2024"

[dependencies]
monfluo-oxide = { path = "../external-libs/monfluo-oxide" }
jni = "0.21.1"
const_format = "0.2.35"

[lib]
name = "monfluo_oxide"
