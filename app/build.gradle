apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    ndkVersion '27.1.12297006'
    defaultConfig {
        applicationId "org.monfluo.wallet"
        minSdkVersion 26
        targetSdkVersion 35
        compileSdk 35
        versionCode 80000
        versionName "0.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }

    flavorDimensions 'type'
    productFlavors {
        beta {
            dimension 'type'
            applicationIdSuffix '.beta'
            versionNameSuffix ' (beta)'
        }
        prod {
            dimension 'type'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    def dbgBld = project.hasProperty('dbgBld')

    splits {
        abi {
            enable true
            reset()
            if (dbgBld) {
                include 'arm64-v8a'
                universalApk false
            } else {
                include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                universalApk true
            }
        }
    }

    // Map for the version code that gives each ABI a value.
    def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]

    // Enumerate translated locales
    def availableLocales = ["en"]
    new File("app/src/main/res/").eachFileMatch(~/^values-.*/) { file ->
        def languageTag = file.name.substring(7).replace("-r", "-")
        if (languageTag != "night")
            availableLocales.add(languageTag)
    }

    // APKs for the same app that all have the same version information.
    android.applicationVariants.all { variant ->
        // Update string resource: available_locales
        variant.resValue("string", "available_locales", availableLocales.join(","))
        // Assigns a different version code for each output APK.
        variant.outputs.all {
            output ->
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                output.versionCodeOverride = abiCodes.get(abiName, 0) + 10 * versionCode

                if (abiName == null) abiName = "universal"
                def v = "${variant.versionName}"
                    .replace(" ", "")
                    .replace(".", "x")
                    .replace("(", "-")
                    .replace(")", "")
                outputFileName = "${rootProject.ext.apkName}-${v}-${abiName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'org.monfluo.wallet'
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    // Android stuff
    //noinspection GradleDependency cannot be updated past 1.13.1 without bumping minSdkVersion
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.0'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Slide to Send tx sliders
    implementation 'com.ncorti:slidetoact:0.11.0'

    // QR Code stuff
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.2'
}