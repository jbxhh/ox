apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId "org.monfluo.wallet.beta"
        minSdkVersion 26
        targetSdkVersion 36
        compileSdk 36
        versionCode 90400
        versionName "0.9.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    def buildAll = project.hasProperty('monfluo-all')
    def buildArm32 = project.hasProperty('monfluo-arm32')
    def buildArm64 = project.hasProperty('monfluo-arm64')
    def buildX86_64 = project.hasProperty('monfluo-x86_64')
    def buildUniversal = project.hasProperty('monfluo-universal')

    splits {
        abi {
            enable true
            reset()
            universalApk buildUniversal
            if (buildAll) {
                include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            } else if (buildArm32) {
                include 'armeabi-v7a'
            } else if (buildArm64) {
                include 'arm64-v8a'
            } else if (buildX86_64) {
                include 'x86_64'
            }
        }
    }

    // Map for the version code that gives each ABI a value.
    def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86_64': 4]

    // APKs for the same app that all have the same version information.
    android.applicationVariants.all { variant ->
        // Assigns a different version code for each output APK.
        variant.outputs.all {
            output ->
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                output.versionCodeOverride = abiCodes.get(abiName, 0) + 10 * versionCode

                if (abiName == null) abiName = "universal"
                def v = "${variant.versionName}"
                    .replace(" ", "")
                    .replace(".", "x")
                    .replace("(", "-")
                    .replace(")", "")
                outputFileName = "${rootProject.ext.apkName}-${v}-${abiName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'org.monfluo.wallet'
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    // Android stuff
    //noinspection GradleDependency cannot be updated past 1.13.1 without bumping minSdkVersion
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Slide to Send tx sliders
    implementation 'com.ncorti:slidetoact:0.11.0'

    // QR Code stuff
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.2'
}
